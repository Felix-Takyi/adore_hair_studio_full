<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Adore Hair Studio Admin</title>

    <style>
        :root {
            --g: #c9a84c;
            --b: #0b0b0b;
            --bg: #f6f3ed;
            --card: #fff;
            --muted: #777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: #181818;
        }

        header {
            background: var(--b);
            color: #fff;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header strong {
            color: var(--g);
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 6px 24px #0000000d;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .tabs button,
        .btn {
            border: 0;
            border-radius: 9px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .tabs button.active,
        .btn.primary {
            background: var(--b);
            color: var(--g);
        }

        .btn.danger {
            background: #a72626;
            color: #fff;
        }

        .btn.secondary {
            background: #ece7db;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: #555;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 5px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        textarea {
            min-height: 90px;
        }

        .row {
            border-top: 1px solid #eee;
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .row:first-child {
            border-top: 0;
        }

        .row small {
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .login {
            max-width: 420px;
            margin: 80px auto;
        }

        .notice {
            padding: 10px;
            border-radius: 8px;
            background: #fff2c7;
            margin-bottom: 12px;
        }

        .msg-unread {
            font-weight: 700;
        }

        .image-preview img {
            max-width: 180px;
            max-height: 180px;
            object-fit: cover;
            margin-top: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .upload-status {
            display: inline-block;
            margin-left: 10px;
            font-size: 12px;
            color: #555;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .row {
                flex-direction: column;
            }

            .actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <strong>ADORE</strong> Hair Studio Admin
    </div>

    <button
        class="btn secondary"
        id="logoutBtn"
        onclick="logout()">
        Logout
    </button>
</header>

<main>

    <!-- LOGIN -->
    <section id="loginView" class="card login">

        <h2>Admin Login</h2>

        <div class="notice">
            Use the ADMIN_EMAIL and ADMIN_PASSWORD
        </div>

        <label>
            Email
            <input id="loginEmail" type="email">
        </label>

        <br><br>

        <label>
            Password
            <input id="loginPassword" type="password">
        </label>

        <br><br>

        <button
            class="btn primary"
            onclick="login()">
            Sign in
        </button>

        <p id="loginErr"></p>

    </section>


    <!-- ADMIN APPLICATION -->
    <section id="appView" class="hidden">

        <div class="tabs">

            <button
                data-tab="products"
                class="active">
                Products
            </button>

            <button data-tab="services">
                Services
            </button>

            <button data-tab="testimonials">
                Testimonials
            </button>

            <button data-tab="messages">
                Messages
            </button>

            <button data-tab="settings">
                Site Settings
            </button>

        </div>

        <div id="content" class="card"></div>

    </section>

</main>


<script>

    /* =========================================================
       AUTHENTICATION / API
    ========================================================= */

    let token =
        localStorage.getItem('adore_admin_token') || '';

    let tab = 'products';


    const api = (path, opt = {}) =>
        fetch(path, {
            ...opt,
            headers: {
                'Content-Type': 'application/json',
                ...(opt.headers || {}),
                ...(token
                    ? {Authorization: 'Bearer ' + token}
                    : {})
            }
        })
            .then(async r => {

                if (r.status === 401) {
                    logout();
                    throw Error('Session expired');
                }

                if (!r.ok) {
                    throw Error(
                        (await r.text()) || 'Request failed'
                    );
                }

                return r.status === 204
                    ? null
                    : r.json();
            });


    function showApp() {

        document
            .getElementById('loginView')
            .classList.add('hidden');

        document
            .getElementById('appView')
            .classList.remove('hidden');

        document.getElementById(
            'logoutBtn'
        ).style.visibility = 'visible';

        load();
    }


    function showLogin() {

        document
            .getElementById('loginView')
            .classList.remove('hidden');

        document
            .getElementById('appView')
            .classList.add('hidden');

        document.getElementById(
            'logoutBtn'
        ).style.visibility = 'hidden';
    }


    async function login() {

        const loginErr =
            document.getElementById('loginErr');

        loginErr.textContent = '';

        try {

            const email =
                document.getElementById('loginEmail').value;

            const password =
                document.getElementById('loginPassword').value;

            const r = await api(
                '/api/auth/login',
                {
                    method: 'POST',
                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

            token = r.token;

            localStorage.setItem(
                'adore_admin_token',
                token
            );

            showApp();

        } catch (e) {

            loginErr.textContent = e.message;
        }
    }


    function logout() {

        token = '';

        localStorage.removeItem(
            'adore_admin_token'
        );

        showLogin();
    }


    /* =========================================================
       TABS
    ========================================================= */

    document
        .querySelectorAll('.tabs button')
        .forEach(button => {

            button.onclick = () => {

                document
                    .querySelectorAll('.tabs button')
                    .forEach(x =>
                        x.classList.remove('active')
                    );

                button.classList.add('active');

                tab = button.dataset.tab;

                load();
            };
        });


    /* =========================================================
       HELPERS
    ========================================================= */

    const esc = s =>
        String(s ?? '')
            .replace(
                /[&<>"]/g,
                c => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;'
                }[c])
            );


    const arg = x =>
        JSON.stringify(x)
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'")
            .replace(/</g, '\\u003c')
            .replace(/>/g, '\\u003e');


    /* =========================================================
       LOAD CURRENT TAB
    ========================================================= */

    async function load() {

        const content =
            document.getElementById('content');

        content.innerHTML = 'Loading…';

        try {

            if (tab === 'products') {
                renderProducts(
                    await api('/api/admin/products')
                );
            }

            if (tab === 'services') {
                renderServices(
                    await api('/api/admin/services')
                );
            }

            if (tab === 'testimonials') {
                renderTestimonials(
                    await api('/api/admin/testimonials')
                );
            }

            if (tab === 'messages') {
                renderMessages(
                    await api('/api/admin/messages')
                );
            }

            if (tab === 'settings') {
                renderSettings(
                    await api('/api/admin/settings')
                );
            }

        } catch (e) {

            content.innerHTML =
                '<p>' + esc(e.message) + '</p>';
        }
    }


    /* =========================================================
       PRODUCTS
    ========================================================= */

    function renderProducts(xs) {

        content.innerHTML = `

            <h2>Products</h2>

            <p>
                Add and manage wigs. Product photos can now
                be uploaded directly to Cloudinary.
            </p>

            <button
                class="btn primary"
                onclick="productForm()">
                + Add product
            </button>

            <div id="form"></div>

            <div>

                ${xs.map(x => `

                    <div class="row">

                        <div>

                            <b>${esc(x.name)}</b>

                            <br>

                            <small>

                                GH₵ ${esc(x.price)}

                                · ${esc(x.category || '')}

                                ${x.featured
                                    ? ' · Featured'
                                    : ''}

                                ${x.active
                                    ? ''
                                    : ' · Hidden'}

                            </small>

                        </div>

                        <div class="actions">

                            <button
                                class="btn secondary"
                                onclick='productForm(${arg(x)})'>
                                Edit
                            </button>

                            <button
                                class="btn danger"
                                onclick="del('products', ${x.id})">
                                Delete
                            </button>

                        </div>

                    </div>

                `).join('')}

            </div>
        `;
    }

                            </option>

                            <option
                                value="body-wave"
                                ${x.category === 'body-wave'
                                    ? 'selected'
                                    : ''}>
                                Body Wave
                            </option>

                            <option
                                value="curly"
                                ${x.category === 'curly'
                                    ? 'selected'
                                    : ''}>
                                Curly
                            </option>

                            <option
                                value="colored"
                                ${x.category === 'colored'
                                    ? 'selected'
                                    : ''}>

                            </option>

                            <option
                                value="closure"
                                ${x.category === 'closure'

                            </option>

                    <label>

                    </label>

                </div>

                <label>

                    Product Image

                    <input
                        id="pfile"

                <div
                    id="imagePreview"

                        x.imageUrl
                            ? `
                                <img
                                    src="${esc(x.imageUrl)}"
                                    alt="Product image">
                              `
                            : ''
                    }

                </div>


                <button
                    type="button"
                    class="btn secondary"
                    onclick="uploadProductImage()"
                    style="margin-top:10px">

                    Upload Image

                </button>


                <span
                    id="uploadStatus"
                    class="upload-status">
                </span>


                <br><br>


                <label>

                    Description

                    <textarea
                        id="pdesc"
                        placeholder="Describe the wig...">${esc(x.description || '')}</textarea>

                </label>


                <p>

                    <label>

                        <input
                            id="pfeatured"
                            type="checkbox"
                            ${x.featured
                                ? 'checked'
                                : ''}>

                        Featured

                    </label>


                    &nbsp;&nbsp;


                    <label>

                        <input
                            id="pactive"
                            type="checkbox"
                            ${x.active !== false
                                ? 'checked'
                                : ''}>

                        Active

                    </label>

                </p>


                <button
                    class="btn primary"
                    onclick="saveProduct(${x.id || 'null'})">

                    Save Product

                </button>

            </div>
        `;
    }


    async function uploadProductImage() {

        const input =
            document.getElementById('pfile');

        const file =
            input.files[0];

        const status =
            document.getElementById(
                'uploadStatus'
            );


        if (!file) {

            alert('Choose an image first.');

            return;
        }


        const allowedTypes = [
            'image/jpeg',
            'image/png',
            'image/webp'
        ];


        if (!allowedTypes.includes(file.type)) {

            alert(
                'Only JPG, PNG and WEBP images are allowed.'
            );

            return;
        }


        const maxSize =
            10 * 1024 * 1024;


        if (file.size > maxSize) {

            alert(
                'Image is too large. Maximum size is 10MB.'
            );

            return;
        }


        status.textContent =
            'Uploading...';


        const formData =
            new FormData();


        formData.append(
            'file',
            file
        );


        try {

            const res =
                await fetch(
                    '/api/admin/images/upload',
                    {
                        method: 'POST',

                        headers: {
                            Authorization:
                                'Bearer ' + token
                        },

                        body: formData
                    }
                );


            if (res.status === 401) {

                logout();

                throw new Error(
                    'Session expired'
                );
            }


            if (!res.ok) {

                throw new Error(
                    await res.text()
                );
            }


            const result =
                await res.json();


            if (!result.url) {

                throw new Error(
                    'Upload completed but no image URL was returned.'
                );
            }


            document
                .getElementById('pimg')
                .value =
                result.url;


            document
                .getElementById(
                    'imagePreview'
                )
                .innerHTML = `

                    <img
                        src="${esc(result.url)}"
                        alt="Uploaded product image">

                `;


            status.textContent =
                '✓ Uploaded successfully';


        } catch (e) {

            console.error(
                'Image upload failed:',
                e
            );


            status.textContent =
                'Upload failed';


            alert(
                'Image upload failed. Check the browser console or server logs.'
            );
        }
    }


    async function saveProduct(id) {

        const name =
            document.getElementById('pname')
                .value
                .trim();

        const price =
            document.getElementById('pprice')
                .value;

        const imageUrl =
            document.getElementById('pimg')
                .value;


        if (!name) {

            alert(
                'Please enter the product name.'
            );

            return;
        }


        if (
            !price ||
            Number(price) <= 0
        ) {

            alert(
                'Please enter a valid product price.'
            );

            return;
        }


        if (!imageUrl) {

            alert(
                'Please upload a product image before saving.'
            );

            return;
        }


        const body = {

            name,

            price:
                Number(price),

            oldPrice:
                document
                    .getElementById('pold')
                    .value

                    ? Number(
                        document
                            .getElementById('pold')
                            .value
                      )

                    : null,

            category:
                document
                    .getElementById('pcat')
                    .value,

            tag:
                document
                    .getElementById('ptag')
                    .value
                    .trim(),

            imageUrl,

            stars:
                Number(
                    document
                        .getElementById('pstars')
                        .value
                ),

            displayOrder:
                Number(
                    document
                        .getElementById('porder')
                        .value
                ),

            description:
                document
                    .getElementById('pdesc')
                    .value
                    .trim(),

            featured:
                document
                    .getElementById('pfeatured')
                    .checked,

            active:
                document
                    .getElementById('pactive')
                    .checked
        };


        try {

            await api(

                '/api/admin/products'
                + (id
                    ? '/' + id
                    : ''),

                {

                    method:
                        id
                            ? 'PUT'
                            : 'POST',

                    body:
                        JSON.stringify(body)

                }
            );


            alert(
                id
                    ? 'Product updated successfully.'
                    : 'Product added successfully.'
            );


            load();


        } catch (e) {

            alert(
                'Could not save product: '
                + e.message
            );
        }
    }

    async function saveService(id) {

        const body = {

            name:
                document
                    .getElementById('sname')
                    .value,

            priceLabel:
                document
                    .getElementById('sprice')
                    .value,

            icon:
                document
                    .getElementById('sicon')
                    .value,

            displayOrder:
                Number(
                    document
                        .getElementById('sorder')
                        .value
                ),

            description:
                document
                    .getElementById('sdesc')
                    .value,

            active:
                document
                    .getElementById('sactive')
                    .checked
        };


        await api(

            '/api/admin/services'
            + (id
                ? '/' + id
                : ''),

            {
                method:
                    id
                        ? 'PUT'
                        : 'POST',

                body:
                    JSON.stringify(body)
            }
        );


        load();
    }

                    class="btn primary"
                    onclick="saveTestimonial(${x.id || 'null'})">

                    Save

                </button>

            </div>

        `;
    }


    async function saveTestimonial(id) {

        const body = {

            name:
                document
                    .getElementById('tname')
                    .value,

            title:
                document
                    .getElementById('ttitle')
                    .value,

            stars:
                Number(
                    document
                        .getElementById('tstars')
                        .value
                ),

            displayOrder:
                Number(
                    document
                        .getElementById('torder')
                        .value
                ),

            text:
                document
                    .getElementById('ttext')
                    .value,

            active:
                document
                    .getElementById('tactive')
                    .checked
        };


        await api(

            '/api/admin/testimonials'
            + (id
                ? '/' + id
                : ''),

            {
                method:
                    id
                        ? 'PUT'
                        : 'POST',

                body:
                    JSON.stringify(body)
            }
        );


        load();
    }

    function renderMessages(xs) {

                            ${

    async function saveSettings() {

        const body = {

            id: 1,

                    .getElementById('xemail')

    /* =========================================================
       DELETE
    ========================================================= */

 async function del(type, id) {
    const ok = confirm(
        'Are you sure you want to permanently delete this item?'
    );

    if (!ok) return;

    try {
        await api(
            '/api/admin/' + type + '/' + id,
            {
                method: 'DELETE'
            }
        );

        alert('Deleted successfully.');

        await load();

    } catch (e) {
        console.error('Delete failed:', e);

        alert(
            'Could not delete this item.\n\n' +
            e.message
        );
    }
}

    /* =========================================================
       START
    ========================================================= */

    if (token) {
        showApp();
    } else {
        showLogin();
    }

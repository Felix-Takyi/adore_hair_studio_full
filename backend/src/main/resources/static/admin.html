<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script>
        (function(){
            const saved=localStorage.getItem('adore_admin_theme')||'light';
            document.documentElement.dataset.theme=saved==='dark'?'dark':'light';
        })();
    </script>

    <title>Adore Hair Studio Admin</title>

    <link rel="icon" type="image/png" href="/AHSicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --black: #080808;
            --deep: #111111;
            --rich: #1a1a1a;
            --gold: #c9a84c;
            --gold-lt: #e2c06a;
            --white: #ffffff;
            --cream: #fdf8f1;
            --blush: #faf0f4;
            --pink: #f0c8d8;
            --pink-md: #d48aaa;
            --gray: #888888;
            --muted: #8a8580;
            --line: #ece6da;
            --danger: #b3312c;
            --danger-lt: #fbeceb;
            --ok: #2f7a4d;
            --ok-lt: #eaf6ee;
            --serif: 'Playfair Display', serif;
            --sans: 'Poppins', sans-serif;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--sans);
            background:
                radial-gradient(1200px 500px at 10% -10%, #fbf1de 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, var(--blush) 0%, transparent 55%),
                var(--cream);
            color: var(--rich);
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: var(--serif);
            margin: 0 0 4px;
            color: var(--black);
        }

        /* ---------- HEADER ---------- */

        header {
            background: linear-gradient(120deg, var(--black) 0%, var(--deep) 55%, #221a12 100%);
            color: #fff;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 40;
            box-shadow: 0 8px 24px rgba(0,0,0,.18);
            border-bottom: 1px solid rgba(201,168,76,.35);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--gold-lt), var(--gold) 60%, #9c7f34);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--black);
            font-family: var(--serif);
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(201,168,76,.45), inset 0 1px 2px rgba(255,255,255,.5);
            flex: none;
        }

        .brand-text {
            line-height: 1.15;
        }

        .brand-text strong {
            font-family: var(--serif);
            font-size: 19px;
            letter-spacing: .5px;
            color: var(--gold-lt);
            display: block;
        }

        .brand-text span {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #cfcfcf;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-search {
            position: relative;
            width: min(360px, 38vw);
        }

        .top-search i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            pointer-events: none;
        }

        .top-search input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid rgba(201,168,76,.45);
            border-radius: 999px;
            background: rgba(255,255,255,.1);
            color: #fff;
        }

        .top-search input::placeholder {
            color: rgba(255,255,255,.62);
        }

        main {
            max-width: 1220px;
            margin: 0 auto;
            padding: 26px 20px 60px;
        }

        /* ---------- GENERIC CARD ---------- */

        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(20,15,5,.06);
            border: 1px solid var(--line);
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- NAV TABS (thumbnail tiles) ---------- */

        .tabs {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .tabs button {
            border: 1px solid var(--line);
            background: var(--white);
            border-radius: 14px;
            padding: 16px 10px 14px;
            cursor: pointer;
            font-family: var(--sans);
            font-weight: 600;
            font-size: 13px;
            color: var(--rich);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
            box-shadow: 0 4px 14px rgba(20,15,5,.04);
            position: relative;
        }

        .tabs button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(20,15,5,.10);
            border-color: #e6d6a8;
        }

        .tabs button .tab-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: var(--cream);
            color: var(--gold);
            border: 1px solid #eee0bd;
            transition: background .18s var(--ease), color .18s var(--ease);
        }

        .tabs button .tab-badge {
            position: absolute;
            top: 8px;
            right: 10px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .tabs button.active {
            background: var(--black);
            border-color: var(--black);
            color: var(--gold-lt);
        }

        .tabs button.active .tab-icon {
            background: linear-gradient(145deg, var(--gold-lt), var(--gold));
            color: var(--black);
            border-color: transparent;
        }

        /* ---------- BUTTONS ---------- */

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
            font-family: var(--sans);
            font-size: 13.5px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s var(--ease);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.primary {
            background: linear-gradient(120deg, var(--black), var(--deep));
            color: var(--gold-lt);
            box-shadow: 0 8px 20px rgba(0,0,0,.18);
        }

        .btn.danger {
            background: var(--danger-lt);
            color: var(--danger);
        }

        .btn.danger:hover {
            background: var(--danger);
            color: #fff;
        }

        .btn.secondary {
            background: var(--cream);
            color: var(--rich);
            border: 1px solid var(--line);
        }

        .btn.secondary:hover {
            background: #f1e9d6;
        }

        .btn.small {
            padding: 7px 11px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn.block {
            width: 100%;
            justify-content: center;
        }

        /* ---------- FORM ELEMENTS ---------- */

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        label {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-top: 6px;
            font-family: var(--sans);
            font-size: 14px;
            background: #fffdf8;
            color: var(--rich);
            transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,168,76,.18);
        }

        input[type="checkbox"] {
            width: auto;
            accent-color: var(--gold);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* ---------- SECTION HEADER ---------- */

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .section-head p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13.5px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .pill.gold {
            background: #fbf1da;
            color: #8a6a1e;
        }

        .pill.ok {
            background: var(--ok-lt);
            color: var(--ok);
        }

        .pill.off {
            background: #f1eee8;
            color: var(--gray);
        }

        .pill.danger {
            background: var(--danger-lt);
            color: var(--danger);
        }

        /* ---------- LIST ROW (messages) ---------- */

        .row {
            border-top: 1px solid var(--line);
            padding: 16px 4px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .row:first-child {
            border-top: 0;
        }

        .row small {
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: none;
        }

        .msg-unread {
            background: #fffaf0;
            border-radius: 12px;
            border-top: 1px solid var(--line) !important;
            padding: 16px;
        }

        .msg-unread b::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            margin-right: 8px;
        }

        .msg-item {
            display: flex;
            gap: 14px;
            border-top: 1px solid var(--line);
            padding: 16px 4px;
        }

        .msg-item:first-child {
            border-top: 0;
        }

        .msg-item.msg-unread {
            border-top: 1px solid var(--line) !important;
        }

        .msg-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--serif);
            font-weight: 700;
            font-size: 15px;
            color: var(--black);
            background: linear-gradient(145deg, #ece4d0, #d8c58f);
        }

        .msg-unread .msg-avatar {
            background: linear-gradient(145deg, var(--gold-lt), var(--gold));
        }

        .msg-content {
            flex: 1;
            min-width: 0;
        }

        .msg-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .msg-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--black);
        }

        .msg-email {
            color: var(--muted);
            font-weight: 400;
            font-size: 12.5px;
        }

        .msg-date {
            font-size: 11.5px;
            color: var(--muted);
            white-space: nowrap;
        }

        .msg-text {
            margin: 8px 0 0;
            font-size: 13.5px;
            color: var(--rich);
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 46px 20px;
            color: var(--muted);
        }

        .empty-state i {
            font-size: 30px;
            color: #e6d6a8;
            margin-bottom: 10px;
            display: block;
        }

        /* ---------- CARD GRIDS (products / services / testimonials) ---------- */

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        .product-group {
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
        }

        .product-group:first-of-type {
            margin-top: 8px;
        }

        .product-group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .product-group-head h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
        }

        .product-view-switch {
            display: inline-flex;
            gap: 8px;
            padding: 6px;
            margin: 4px 0 18px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--cream);
        }

        .product-view-switch button {
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            background: transparent;
            color: var(--muted);
            font-family: var(--sans);
            font-weight: 600;
            cursor: pointer;
        }

        .product-view-switch button.active {
            background: var(--black);
            color: var(--gold-lt);
            box-shadow: 0 6px 16px rgba(0,0,0,.14);
        }

        .product-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .layout-switch {
            display: inline-flex;
            gap: 5px;
            padding: 5px;
            margin: 4px 0 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        .layout-switch button {
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            background: transparent;
            color: var(--muted);
            font-family: var(--sans);
            font-weight: 600;
            cursor: pointer;
        }

        .layout-switch button.active {
            background: var(--black);
            color: var(--gold-lt);
        }

        .item-grid.list-view {
            grid-template-columns: 1fr;
        }

        .item-grid.list-view .item-card {
            display: grid;
            grid-template-columns: 170px minmax(0, 1fr);
        }

        .item-grid.list-view .item-thumb,
        .item-grid.list-view .item-thumb-icon {
            width: 170px;
            height: 100%;
            min-height: 155px;
            aspect-ratio: auto;
        }

        .item-grid.list-view .item-actions {
            margin-top: auto;
        }

        .admin-records.grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }

        .admin-records.grid-view .msg-item,
        .admin-records.grid-view .msg-item:first-child {
            height: 100%;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        .product-form-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(8,8,8,.72);
            backdrop-filter: blur(5px);
        }

        .product-form-modal {
            width: min(920px, 100%);
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            margin: 0;
            border: 1px solid #eee0bd;
            background: #fffdf6;
            box-shadow: 0 28px 80px rgba(0,0,0,.35);
        }

        .product-form-head {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: 14px;
            background: #fffdf6;
            border-bottom: 1px solid var(--line);
        }

        .modal-close {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: var(--cream);
            color: var(--black);
            cursor: pointer;
        }

        .cat-manager-modal {
            width: min(520px, 100%);
        }

        /* ---------- CUSTOM ADMIN ALERTS ---------- */
        .admin-alert-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(8,8,8,.70);
            backdrop-filter: blur(6px);
            animation: adminAlertFade .18s ease-out;
        }

        .admin-alert-modal {
            width: min(520px, 100%);
            overflow: hidden;
            border: 1px solid #eadfca;
            border-radius: 18px;
            background: #fffdf8;
            box-shadow: 0 30px 90px rgba(0,0,0,.42);
            animation: adminAlertPop .2s var(--ease);
        }

        .admin-alert-head {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--black), #211a12);
            color: #fff;
        }

        .admin-alert-icon {
            width: 42px;
            height: 42px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--gold);
            color: var(--black);
            font-size: 17px;
            box-shadow: 0 5px 18px rgba(201,168,76,.25);
        }

        .admin-alert-title {
            flex: 1;
            min-width: 0;
        }

        .admin-alert-title strong {
            display: block;
            font-family: var(--serif);
            font-size: 18px;
            color: #fff;
        }

        .admin-alert-title span {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #d5cec3;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        .admin-alert-close {
            width: 34px;
            height: 34px;
            flex: none;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,.09);
            color: #fff;
            cursor: pointer;
        }

        .admin-alert-close:hover { background: rgba(255,255,255,.16); }

        .admin-alert-body {
            padding: 22px 22px 18px;
            color: var(--rich);
            font-size: 14px;
            line-height: 1.7;
        }

        .admin-alert-body .alert-lead {
            margin: 0 0 8px;
            font-weight: 700;
            color: var(--black);
            font-size: 15px;
        }

        .admin-alert-body p { margin: 0; }

        .admin-alert-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 15px 22px 20px;
            border-top: 1px solid var(--line);
            background: rgba(253,248,241,.55);
        }

        .admin-alert-actions .btn { min-width: 104px; }

        html[data-theme="dark"] .admin-alert-modal {
            background: #171615;
            border-color: #3a3328;
            color: #f2ece3;
        }

        html[data-theme="dark"] .admin-alert-body { color: #d8d0c6; }
        html[data-theme="dark"] .admin-alert-body .alert-lead { color: #f7f0e7; }
        html[data-theme="dark"] .admin-alert-actions {
            background: #121110;
            border-color: #2f2b27;
        }

        @keyframes adminAlertFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes adminAlertPop {
            from { opacity: 0; transform: translateY(8px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media(max-width:520px) {
            .admin-alert-overlay { padding: 14px; }
            .admin-alert-body { padding: 20px 18px 16px; }
            .admin-alert-actions { padding: 13px 18px 17px; }
            .admin-alert-actions .btn { flex: 1; min-width: 0; }
        }

        .cat-add-row {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .cat-add-row input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-family: var(--sans);
            font-size: 14px;
            background: #fff;
            color: var(--black);
        }

        .cat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--cream);
        }

        .cat-row .cat-name {
            font-weight: 600;
            font-size: 14px;
        }

        .cat-row .cat-slug {
            font-size: 12px;
            color: var(--muted);
            font-family: var(--mono, monospace);
        }

        .cat-row button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            flex-shrink: 0;
        }

        .cat-row button:hover {
            background: #fbe3e3;
            color: #c0392b;
        }

        .cat-manager-empty {
            text-align: center;
            color: var(--muted);
            padding: 24px 10px;
            font-size: 14px;
        }

        .item-card {
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
            transition: box-shadow .18s var(--ease), transform .18s var(--ease);
        }

        .item-card:hover {
            box-shadow: 0 14px 30px rgba(20,15,5,.10);
            transform: translateY(-2px);
        }

        .item-thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: var(--cream);
        }

        .item-thumb-icon {
            width: 100%;
            aspect-ratio: 16 / 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--gold);
            background: linear-gradient(135deg, var(--cream), #f4ebd6);
        }

        .item-avatar {

<body>

<header>
    <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
            <strong>ADORE Hair Studio</strong>
            <span>Admin Console</span>
        </div>
    </div>

    <div class="header-actions">
        <label class="top-search hidden" id="topSearchWrap" aria-label="Search products">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="topSearch" type="search" placeholder="Search products by name or category..." oninput="handleProductSearch(this.value)">
        </label>
        <button class="theme-toggle" id="themeToggle" type="button" onclick="toggleAdminTheme()" aria-label="Switch to dark mode" title="Switch to dark mode">
            <span class="theme-knob"><i class="fa-solid fa-sun"></i></span>
        </button>
        <button
            class="btn secondary"
            id="logoutBtn"
            onclick="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Logout
        </button>
    </div>
</header>

<main>

    <!-- LOGIN -->
    <section id="loginView" class="hidden">

        <div class="login-wrap">
            <div class="card login">

                <div class="brand-mark">A</div>

                <h2>Welcome back</h2>
                <p class="sub">Sign in to manage Adore Hair Studio</p>

                <div class="notice">
                    <i class="fa-solid fa-circle-info" style="margin-top:2px;"></i>
                    <span>Use the ADMIN_EMAIL and ADMIN_PASSWORD configured on the server.</span>
                </div>

                <label>
                    Email
                    <input id="loginEmail" type="email" placeholder="you@adorehairstudio.com">
                </label>

                <label>
                    Password
                    <input id="loginPassword" type="password" placeholder="••••••••">
                </label>

                <button
                    class="btn primary block"
                    style="margin-top:20px"
                    onclick="login()">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign in
                </button>

                <p id="loginErr"></p>

            </div>
        </div>

    </section>


    <!-- ADMIN APPLICATION -->
    <section id="appView" class="hidden">

        <div class="tabs">

            <button data-tab="dashboard" class="active">
                <span class="tab-icon"><i class="fa-solid fa-gauge-high"></i></span>
                Dashboard
            </button>

            <button data-tab="products">
                <span class="tab-icon"><i class="fa-solid fa-bag-shopping"></i></span>
                All Products
            </button>

            <button data-tab="services">
                <span class="tab-icon"><i class="fa-solid fa-scissors"></i></span>
                Services
            </button>

            <button data-tab="testimonials">
                <span class="tab-icon"><i class="fa-solid fa-quote-left"></i></span>
                Testimonials
            </button>

            <button data-tab="reviews">
                <span class="tab-icon"><i class="fa-solid fa-star-half-stroke"></i></span>
                Reviews
            </button>

            <button data-tab="messages">
                <span class="tab-icon"><i class="fa-solid fa-envelope"></i></span>
                Messages
                <span class="tab-badge hidden" id="msgTabBadge">0</span>
            </button>

            <button data-tab="settings">
                <span class="tab-icon"><i class="fa-solid fa-gear"></i></span>
                Site Settings
            </button>

        </div>

        <div id="content" class="card"></div>

    </section>

</main>


<script>

    function applyAdminTheme(theme){
        const value=theme==='dark'?'dark':'light';
        document.documentElement.dataset.theme=value;
        localStorage.setItem('adore_admin_theme',value);
        const btn=document.getElementById('themeToggle');
        if(btn){
            const dark=value==='dark';
            btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
            btn.setAttribute('title',dark?'Switch to light mode':'Switch to dark mode');
            const icon=btn.querySelector('.theme-knob i');
            if(icon) icon.className=dark?'fa-solid fa-moon':'fa-solid fa-sun';
        }
    }

    function toggleAdminTheme(){
        applyAdminTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
    }

    /* =========================================================
       AUTHENTICATION / API
    ========================================================= */

    let token =
        localStorage.getItem('adore_admin_token') || '';

    document.addEventListener('DOMContentLoaded',()=>applyAdminTheme(document.documentElement.dataset.theme||'light'));

    let tab = 'dashboard';
    let allProductsCache = [];
    let productSearchQuery = '';
    let pendingProductImages = [];
    let adminProductGroup = 'WIG';
    let adminWigCategoryFilter = 'all';
    let adminListLayout = localStorage.getItem('adore_admin_layout') || 'list';
    let hairCategoriesCache = [];


   const api = async (path, opt = {}) => {

    const response = await fetch(path, {
        ...opt,
        headers: {
            'Content-Type': 'application/json',
            ...(opt.headers || {}),
            ...(token
                ? {Authorization: 'Bearer ' + token}
                : {})
        }
    });

    if (response.status === 401) {
        logout();
        throw new Error('Session expired');
    }

    if (!response.ok) {
        const raw = await response.text();
        let parsed = null;
        try { parsed = raw ? JSON.parse(raw) : null; } catch (parseErr) { parsed = null; }
        const err = new Error((parsed && parsed.message) || raw || 'Request failed');
        err.status = response.status;
        err.body = parsed;
        throw err;
    }

    if (response.status === 204) {
        return null;
    }

    const text = await response.text();

    if (!text) {
        return null;
    }

    return JSON.parse(text);
};


    function showApp() {

        document
            .getElementById('loginView')
            .classList.add('hidden');

        document
            .getElementById('appView')
            .classList.remove('hidden');

        document.getElementById(
            'logoutBtn'
        ).style.visibility = 'visible';

        document.getElementById('topSearchWrap').classList.remove('hidden');

        load();
    }


    function showLogin() {

        document
            .getElementById('loginView')
            .classList.remove('hidden');

        document
            .getElementById('appView')
            .classList.add('hidden');

        document.getElementById(
            'logoutBtn'
        ).style.visibility = 'hidden';

        document.getElementById('topSearchWrap').classList.add('hidden');
    }


    async function login() {

        const loginErr =
            document.getElementById('loginErr');

        loginErr.textContent = '';

        try {

            const email =
                document.getElementById('loginEmail').value;

            const password =
                document.getElementById('loginPassword').value;

            const r = await api(
                '/api/auth/login',
                {
                    method: 'POST',
                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

            token = r.token;
            adminListLayout = 'list';
            localStorage.setItem('adore_admin_layout', 'list');

            localStorage.setItem(
                'adore_admin_token',
                token
            );

            showApp();

        } catch (e) {

            loginErr.textContent = e.message;
        }
    }


    function logout() {

        token = '';

        localStorage.removeItem(
            'adore_admin_token'
        );

        showLogin();
    }


    /* =========================================================
       TABS
    ========================================================= */

    document
        .querySelectorAll('.tabs button')
        .forEach(button => {

            button.onclick = () => {

                document
                    .querySelectorAll('.tabs button')
                    .forEach(x =>
                        x.classList.remove('active')
                    );

                button.classList.add('active');

                tab = button.dataset.tab;

                load();
            };
        });


    /* =========================================================
       HELPERS
    ========================================================= */

    const esc = s =>
        String(s ?? '')
            .replace(
                /[&<>"]/g,
                c => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;'
                }[c])
            );


    const arg = x =>
        JSON.stringify(x)
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'")
            .replace(/</g, '\\u003c')
            .replace(/>/g, '\\u003e');


    function formatProductAddedAt(value) {
        if (!value) return 'Added: Date not available';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return 'Added: Date not available';
        return 'Added: ' + new Intl.DateTimeFormat('en-GH', {
            timeZone: 'Africa/Accra',
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
        }).format(date);
    }


    const starIcons = n => {

        const count =
            Math.max(0, Math.min(5, Number(n) || 0));

        return (
            '<i class="fa-solid fa-star"></i>'.repeat(count) +
            '<i class="fa-regular fa-star" style="opacity:.4"></i>'.repeat(5 - count)
        );
    };


    const initials = name =>
        String(name || '?')
            .trim()
            .split(/\s+/)
            .slice(0, 2)
            .map(w => w[0]?.toUpperCase() || '')
            .join('');


    /* =========================================================
       LOAD CURRENT TAB
    ========================================================= */

    async function load() {

        const content =
            document.getElementById('content');

        content.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                Loading…
            </div>
        `;

        try {

            if (tab === 'dashboard') {

                const [
                    products,
                    services,
                    testimonials,
                    messages,
                    reviews
                ] = await Promise.all([
                    api('/api/admin/products'),
                    api('/api/admin/services'),
                    api('/api/admin/testimonials'),
                    api('/api/admin/messages'),
                    api('/api/admin/reviews')
                ]);

                updateMessageBadge(messages);

                renderDashboard({
                    products,
                    services,
                    testimonials,
                    messages,
                    reviews
                });
            }

            if (tab === 'products') {
                const [productsList, categoriesList] = await Promise.all([
                    api('/api/admin/products'),
                    api('/api/admin/hair-categories')
                ]);
                allProductsCache = productsList;
                hairCategoriesCache = categoriesList;
                renderProducts(allProductsCache);
            }

            if (tab === 'services') {
                renderServices(
                    await api('/api/admin/services')
                );
            }

            if (tab === 'testimonials') {
                renderTestimonials(
                    await api('/api/admin/testimonials')
                );
            }

            if (tab === 'reviews') {
                const [reviews, products] = await Promise.all([
                    api('/api/admin/reviews'),
                    api('/api/admin/products')
                ]);

                renderReviews(reviews, products);
            }

            if (tab === 'messages') {
                const messages =
                    await api('/api/admin/messages');

                updateMessageBadge(messages);

                renderMessages(messages);
            }

            if (tab === 'settings') {
                renderSettings(
                    await api('/api/admin/settings')
                );
            }

        } catch (e) {

            content.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    ${esc(e.message)}
                </div>
            `;
        }
    }


    function goTab(name) {

        tab = name;

        document
            .querySelectorAll('.tabs button')
            .forEach(btn =>
                btn.classList.toggle(
                    'active',
                    btn.dataset.tab === name
                )
            );

        load();

    function handleProductSearch(value) {
        productSearchQuery = value.trim().toLowerCase();

        if (productSearchQuery && tab !== 'products') {
            goTab('products');
            return;
        }

        if (tab === 'products') {
            renderProducts(allProductsCache);
        }
    }


    function updateMessageBadge(messages) {

        const badge =
            document.getElementById('msgTabBadge');

        if (!badge) return;

        const unread =
            (messages || [])
                .filter(m => !m.readMessage)
                .length;

        if (unread > 0) {
            badge.textContent =
                unread > 9 ? '9+' : String(unread);
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function getProductType(product) {
        if (product.productType) {
            return String(product.productType).toUpperCase();
        }

        const wigSlugs = hairCategoriesCache.map(c => c.slug);
        return !product.category || wigSlugs.includes(product.category)
            ? 'WIG'
            : 'OTHER';
    }

    const OTHER_CATEGORY_LABELS = {
        'perfume': 'Perfume',
        'hair-care': 'Hair Care',
        'accessories': 'Accessories',
        'other': 'Other'
    };

    function categoryLabel(slug) {
        if (!slug) return slug;
        const wigCat = hairCategoriesCache.find(c => c.slug === slug);
        if (wigCat) return wigCat.name;
        return OTHER_CATEGORY_LABELS[slug] || slug;
    }

    function selectProductGroup(group) {
        adminProductGroup = group;
        adminWigCategoryFilter = 'all';
        renderProducts(allProductsCache);
    }

    function toggleUnassignedWigsFilter() {
        adminWigCategoryFilter = adminWigCategoryFilter === 'unassigned' ? 'all' : 'unassigned';
        renderProducts(allProductsCache);
    }

    function selectAdminLayout(layout) {
        adminListLayout = layout === 'grid' ? 'grid' : 'list';
        localStorage.setItem('adore_admin_layout', adminListLayout);
        if (tab === 'products') renderProducts(allProductsCache);
        else load();
    }

    function updateProductCategoryOptions(selectedCategory = '') {
        const type = document.getElementById('ptype').value;
        const category = document.getElementById('pcat');
        const options = type === 'WIG'
            ? [
                ['', 'Select wig category'],
                ...hairCategoriesCache.map(c => [c.slug, c.name])
              ]
            : [
                ['', 'Select product category'],
                ['perfume', 'Perfume'],
                ['hair-care', 'Hair Care'],
                ['accessories', 'Accessories'],
                ['other', 'Other']
              ];

        const currentValue = selectedCategory || category.value;
        category.innerHTML = options.map(([value, label]) =>
            `<option value="${value}" ${value === currentValue ? 'selected' : ''}>${label}</option>`
        ).join('');
    }

            document.body.appendChild(root);
        }

        root.innerHTML = `

                <div class="product-form-head">

    async function submitNewHairCategory() {
        const input = document.getElementById('newCatName');
        const name = input.value.trim();

        if (!name) {
            input.focus();
            return;
        }

        try {
            const saved = await api('/api/admin/hair-categories', {
                method: 'POST',
                body: JSON.stringify({ name })
            });
            hairCategoriesCache = [...hairCategoriesCache, saved];
            renderCategoryManager();
            if (document.getElementById('ptype') && document.getElementById('pcat')) {
                updateProductCategoryOptions();
            }
        } catch (e) {
            await showAdminMessage(e.message || 'Could not add that category.', 'Category Error', 'Something went wrong');
        }
    }

    function showAdminAlert({
        title = 'Adore Hair Studio',
        subtitle = 'Message',
        lead = '',
        message = '',
        confirmText = 'OK',
        cancelText = 'Cancel',
        showCancel = true,
        icon = 'fa-triangle-exclamation',
        danger = false
    }) {
        return new Promise(resolve => {
            const existing = document.getElementById('adminAlertRoot');
            if (existing) existing.remove();

            const root = document.createElement('div');
            root.id = 'adminAlertRoot';
            root.innerHTML = `
                <div class="admin-alert-overlay" role="presentation">
                    <div class="admin-alert-modal" role="dialog" aria-modal="true" aria-labelledby="adminAlertTitle">
                        <div class="admin-alert-head">
                            <div class="admin-alert-icon" aria-hidden="true">
                                <i class="fa-solid ${icon}"></i>
                            </div>
                            <div class="admin-alert-title">
                                <strong id="adminAlertTitle">${esc(title)}</strong>
                                <span>${esc(subtitle)}</span>
                            </div>
                            <button type="button" class="admin-alert-close" aria-label="Close message">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="admin-alert-body">
                            ${lead ? `<p class="alert-lead">${esc(lead)}</p>` : ''}
                            <p>${message}</p>
                        </div>
                        <div class="admin-alert-actions">
                            ${showCancel ? `<button type="button" class="btn secondary admin-alert-cancel">${esc(cancelText)}</button>` : ''}
                            <button type="button" class="btn ${danger ? 'danger' : 'primary'} admin-alert-confirm">${esc(confirmText)}</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.appendChild(root);
            document.body.style.overflow = 'hidden';

            let closed = false;
            const onKeyDown = event => {
                if (event.key === 'Escape') finish(false);
            };

            const finish = value => {
                if (closed) return;
                closed = true;
                document.removeEventListener('keydown', onKeyDown);
                root.remove();
                if (!document.querySelector('.product-form-overlay')) {
                    document.body.style.overflow = '';
                }
                resolve(value);
            };

            root.querySelector('.admin-alert-confirm').addEventListener('click', () => finish(true));
            root.querySelector('.admin-alert-close').addEventListener('click', () => finish(false));
            const cancel = root.querySelector('.admin-alert-cancel');
            if (cancel) cancel.addEventListener('click', () => finish(false));

            root.querySelector('.admin-alert-overlay').addEventListener('click', event => {
                if (event.target === event.currentTarget) finish(false);
            });

            document.addEventListener('keydown', onKeyDown);

            requestAnimationFrame(() => root.querySelector('.admin-alert-confirm')?.focus());
        });
    }

    function showAdminMessage(message, title = 'Adore Hair Studio', subtitle = 'Message') {
        return showAdminAlert({
            title,
            subtitle,
            message: esc(message),
            confirmText: 'OK',
            showCancel: false,
            icon: 'fa-circle-info'
        });
    }

    async function removeHairCategory(id) {
        const category = hairCategoriesCache.find(c => c.id === id);
        if (!category) return;

        const shouldRemove = await showAdminAlert({
            title: 'Remove Hair Category',
            subtitle: 'Please confirm',
            lead: `Remove the "${category.name}" category?`,
            message: 'This action will remove the category from your hair category list.',
            confirmText: 'Remove',
            cancelText: 'Cancel',
            icon: 'fa-trash-can',
            danger: true
        });

        if (!shouldRemove) return;

        try {
            await api(`/api/admin/hair-categories/${id}`, { method: 'DELETE' });
            afterHairCategoryRemoved(id);
        } catch (e) {
            if (e.status === 409) {
                const count = (e.body && e.body.productCount) || 0;
                const noun = count === 1 ? 'product' : 'products';
                const pronoun = count === 1 ? 'It' : 'They';

                const moveConfirm = await showAdminAlert({
                    title: 'Category Still In Use',
                    subtitle: 'Category Move Notice',
                    lead: `"${category.name}" is still used by ${count} ${noun}.`,
                    message: `Move ${count === 1 ? 'it' : 'them'} to <strong>Unassigned Wigs</strong> instead? ${pronoun} will be hidden from the website but kept in your admin list so you can assign a new category later.`,
                    confirmText: 'Move to Unassigned',
                    cancelText: 'Cancel',
                    icon: 'fa-tags'
                });

                if (!moveConfirm) return;

                try {
                    await api(`/api/admin/hair-categories/${id}?moveToUnassigned=true`, { method: 'DELETE' });
                    afterHairCategoryRemoved(id);
                } catch (e2) {
                    await showAdminMessage(e2.message || 'Could not remove that category.', 'Category Error', 'Something went wrong');
                }
            } else {
                await showAdminMessage(e.message || 'Could not remove that category.', 'Category Error', 'Something went wrong');
            }
        }
    }

    async function uploadProductImages() {
        const files = [...document.getElementById('pfile').files];
        const status = document.getElementById('uploadStatus');
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        const maxSize = 10 * 1024 * 1024;

        if (!files.length) { alert('Choose one or more images first.'); return; }
        if (files.some(file => !allowedTypes.includes(file.type))) { alert('Only JPG, PNG and WEBP images are allowed.'); return; }
        if (files.some(file => file.size > maxSize)) { alert('Each image must be 10MB or smaller.'); return; }

        status.textContent = `Uploading 0 of ${files.length}...`;
        try {
            for (let index = 0; index < files.length; index++) {
                const formData = new FormData();
                formData.append('file', files[index]);
                const res = await fetch('/api/admin/images/upload', {
                    method: 'POST',
                    headers: {Authorization: 'Bearer ' + token},
                    body: formData
                });
                if (res.status === 401) { logout(); throw new Error('Session expired'); }
                if (!res.ok) throw new Error(await res.text());
                const result = await res.json();
                if (!result.url) throw new Error('No image URL was returned.');
                if (!pendingProductImages.includes(result.url)) pendingProductImages.push(result.url);
                status.textContent = `Uploading ${index + 1} of ${files.length}...`;
                renderPendingProductImages();
            }
            status.textContent = `✓ ${files.length} image${files.length === 1 ? '' : 's'} uploaded`;
            document.getElementById('pfile').value = '';
        } catch (e) {
            console.error('Image upload failed:', e);
            status.textContent = 'Upload failed';
            alert('One or more images could not be uploaded. Images completed before the error are still available.');
        }
    }

    function generateProductDescription() {
        const name = document.getElementById('pname').value.trim();
        const type = document.getElementById('ptype').value;
        const categorySelect = document.getElementById('pcat');
        const category = (categorySelect.options[categorySelect.selectedIndex]?.text || 'product').toLowerCase();
        const tag = document.getElementById('ptag').value.trim();
        if (!name) { alert('Enter the product name first.'); return; }
        const description = type === 'WIG'
            ? buildWigDescription(name, category, tag)
            : buildOtherDescription(name, category, tag);
        document.getElementById('pdesc').value = description;
    }


    async function saveProduct(id) {

        const name =
            document.getElementById('pname')
                .value
                .trim();

        const price =
            document.getElementById('pprice')
                .value;

        const imageUrl = pendingProductImages[0] || '';

        const productType = document.getElementById('ptype').value;
        const category = document.getElementById('pcat').value;


        if (!name) {

            alert(
                'Please enter the product name.'
            );

            return;
        }


        if (
            !price ||
            Number(price) <= 0
        ) {

            alert(
                'Please enter a valid product price.'
            );

            return;
        }


        if (!imageUrl) {

            alert(
                'Please upload a product image before saving.'
            );

            return;
        }

        if (!category) {
            alert('Please select a category for this product.');
            return;
        }


        const body = {

            name,

            price:
                Number(price),

            oldPrice:
                document
                    .getElementById('pold')
                    .value

                    ? Number(
                        document
                            .getElementById('pold')
                            .value
                      )

                    : null,

            productType,

            category,

            tag:
                document
                    .getElementById('ptag')
                    .value
                    .trim(),

            imageUrl,

            imageUrls: pendingProductImages,

            stars:
                Number(
                    document
                        .getElementById('pstars')
                        .value
                ),

            displayOrder:
                Number(
                    document
                        .getElementById('porder')
                        .value
                ),

            description:
                document
                    .getElementById('pdesc')
                    .value
                    .trim(),

            featured:
                document
                    .getElementById('pfeatured')
                    .checked,

            active:
                document
                    .getElementById('pactive')
                    .checked
        };


        try {

            await api(

                '/api/admin/products'
                + (id
                    ? '/' + id
                    : ''),

                {

                    method:
                        id
                            ? 'PUT'
                            : 'POST',

                    body:
                        JSON.stringify(body)

                }
            );


            alert(
                id
                    ? 'Product updated successfully.'
                    : 'Product added successfully.'
            );

            document.body.style.overflow = '';
            load();


        } catch (e) {

            alert(
                'Could not save product: '
                + e.message
            );
        }
    }

            </div>

        `;
    }


    async function markRead(id) {

        await api(

            '/api/admin/messages/'
            + id
            + '/read',

            {
                method: 'PUT'
            }
        );


        load();
    }

    async function saveSettings() {

        const body = {

            id: 1,

                    .value,

            whatsapp:

                    .getElementById('xwa')
                    .value,

                    .getElementById('xig')
                    .value,

            address:

                    .getElementById('xaddress')

                    .value,

            heroTitle:
                document
                    .getElementById('xtitle')
                    .value,

            heroTagline:
                document
                    .getElementById('xtag')
                    .value

            '/api/admin/settings',

    /* =========================================================
       DELETE
    ========================================================= */

 async function del(type, id) {
    const ok = confirm(
        'Are you sure you want to permanently delete this item?'
    );

    if (!ok) return;

    try {
        await api(
            '/api/admin/' + type + '/' + id,
            {
                method: 'DELETE'
            }
        );

        alert('Deleted successfully.');

        await load();

    } catch (e) {
        console.error('Delete failed:', e);

        alert(
            'Could not delete this item.\n\n' +
            e.message
        );
    }
}

    /* =========================================================
       START
    ========================================================= */

    if (token) {
        showApp();
    } else {
        showLogin();

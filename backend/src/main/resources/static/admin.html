<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Adore Hair Studio Admin</title>

    <link rel="icon" type="image/png" href="/AHSicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --black: #080808;
            --deep: #111111;
            --rich: #1a1a1a;
            --gold: #c9a84c;
            --gold-lt: #e2c06a;
            --white: #ffffff;
            --cream: #fdf8f1;
            --blush: #faf0f4;
            --pink: #f0c8d8;
            --pink-md: #d48aaa;
            --gray: #888888;
            --muted: #8a8580;
            --line: #ece6da;
            --danger: #b3312c;
            --danger-lt: #fbeceb;
            --ok: #2f7a4d;
            --ok-lt: #eaf6ee;
            --serif: 'Playfair Display', serif;
            --sans: 'Poppins', sans-serif;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--sans);
            background:
                radial-gradient(1200px 500px at 10% -10%, #fbf1de 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, var(--blush) 0%, transparent 55%),
                var(--cream);
            color: var(--rich);
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: var(--serif);
            margin: 0 0 4px;
            color: var(--black);
        }

        /* ---------- HEADER ---------- */

        header {
            background: linear-gradient(120deg, var(--black) 0%, var(--deep) 55%, #221a12 100%);
            color: #fff;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 40;
            box-shadow: 0 8px 24px rgba(0,0,0,.18);
            border-bottom: 1px solid rgba(201,168,76,.35);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--gold-lt), var(--gold) 60%, #9c7f34);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--black);
            font-family: var(--serif);
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(201,168,76,.45), inset 0 1px 2px rgba(255,255,255,.5);
            flex: none;
        }

        .brand-text {
            line-height: 1.15;
        }

        .brand-text strong {
            font-family: var(--serif);
            font-size: 19px;
            letter-spacing: .5px;
            color: var(--gold-lt);
            display: block;
        }

        .brand-text span {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #cfcfcf;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-search {
            position: relative;
            width: min(360px, 38vw);
        }

        .top-search i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            pointer-events: none;
        }

        .top-search input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid rgba(201,168,76,.45);
            border-radius: 999px;
            background: rgba(255,255,255,.1);
            color: #fff;
        }

        .top-search input::placeholder {
            color: rgba(255,255,255,.62);
        }

        main {
            max-width: 1220px;
            margin: 0 auto;
            padding: 26px 20px 60px;
        }

        /* ---------- GENERIC CARD ---------- */

        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(20,15,5,.06);
            border: 1px solid var(--line);
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- NAV TABS (thumbnail tiles) ---------- */

        .tabs {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .tabs button {
            border: 1px solid var(--line);
            background: var(--white);
            border-radius: 14px;
            padding: 16px 10px 14px;
            cursor: pointer;
            font-family: var(--sans);
            font-weight: 600;
            font-size: 13px;
            color: var(--rich);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
            box-shadow: 0 4px 14px rgba(20,15,5,.04);
            position: relative;
        }

        .tabs button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(20,15,5,.10);
            border-color: #e6d6a8;
        }

        .tabs button .tab-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: var(--cream);
            color: var(--gold);
            border: 1px solid #eee0bd;
            transition: background .18s var(--ease), color .18s var(--ease);
        }

        .tabs button .tab-badge {
            position: absolute;
            top: 8px;
            right: 10px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .tabs button.active {
            background: var(--black);
            border-color: var(--black);
            color: var(--gold-lt);
        }

        .tabs button.active .tab-icon {
            background: linear-gradient(145deg, var(--gold-lt), var(--gold));
            color: var(--black);
            border-color: transparent;
        }

        /* ---------- BUTTONS ---------- */

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
            font-family: var(--sans);
            font-size: 13.5px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s var(--ease);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.primary {
            background: linear-gradient(120deg, var(--black), var(--deep));
            color: var(--gold-lt);
            box-shadow: 0 8px 20px rgba(0,0,0,.18);
        }

        .btn.danger {
            background: var(--danger-lt);
            color: var(--danger);
        }

        .btn.danger:hover {
            background: var(--danger);
            color: #fff;
        }

        .btn.secondary {
            background: var(--cream);
            color: var(--rich);
            border: 1px solid var(--line);
        }

        .btn.secondary:hover {
            background: #f1e9d6;
        }

        .btn.small {
            padding: 7px 11px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn.block {
            width: 100%;
            justify-content: center;
        }

        /* ---------- FORM ELEMENTS ---------- */

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        label {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-top: 6px;
            font-family: var(--sans);
            font-size: 14px;
            background: #fffdf8;
            color: var(--rich);
            transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,168,76,.18);
        }

        input[type="checkbox"] {
            width: auto;
            accent-color: var(--gold);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* ---------- SECTION HEADER ---------- */

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .section-head p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13.5px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .pill.gold {
            background: #fbf1da;
            color: #8a6a1e;
        }

        .pill.ok {
            background: var(--ok-lt);
            color: var(--ok);
        }

        .pill.off {
            background: #f1eee8;
            color: var(--gray);
        }

        .pill.danger {
            background: var(--danger-lt);
            color: var(--danger);
        }

        /* ---------- LIST ROW (messages) ---------- */

        .row {
            border-top: 1px solid var(--line);
            padding: 16px 4px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .row:first-child {
            border-top: 0;
        }

        .row small {
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: none;
        }

        .msg-unread {
            background: #fffaf0;
            border-radius: 12px;
            border-top: 1px solid var(--line) !important;
            padding: 16px;
        }

        .msg-unread b::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            margin-right: 8px;
        }

        .msg-item {
            display: flex;
            gap: 14px;
            border-top: 1px solid var(--line);
            padding: 16px 4px;
        }

        .msg-item:first-child {
            border-top: 0;
        }

        .msg-item.msg-unread {
            border-top: 1px solid var(--line) !important;
        }

        .msg-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--serif);
            font-weight: 700;
            font-size: 15px;
            color: var(--black);
            background: linear-gradient(145deg, #ece4d0, #d8c58f);
        }

        .msg-unread .msg-avatar {
            background: linear-gradient(145deg, var(--gold-lt), var(--gold));
        }

        .msg-content {
            flex: 1;
            min-width: 0;
        }

        .msg-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .msg-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--black);
        }

        .msg-email {
            color: var(--muted);
            font-weight: 400;
            font-size: 12.5px;
        }

        .msg-date {
            font-size: 11.5px;
            color: var(--muted);
            white-space: nowrap;
        }

        .msg-text {
            margin: 8px 0 0;
            font-size: 13.5px;
            color: var(--rich);
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 46px 20px;
            color: var(--muted);
        }

        .empty-state i {
            font-size: 30px;
            color: #e6d6a8;
            margin-bottom: 10px;
            display: block;
        }

        /* ---------- CARD GRIDS (products / services / testimonials) ---------- */

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        .product-group {
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
        }

        .product-group:first-of-type {
            margin-top: 8px;
        }

        .product-group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .product-group-head h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
        }

        .product-view-switch {
            display: inline-flex;
            gap: 8px;
            padding: 6px;
            margin: 4px 0 18px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--cream);
        }

        .product-view-switch button {
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            background: transparent;
            color: var(--muted);
            font-family: var(--sans);
            font-weight: 600;
            cursor: pointer;
        }

        .product-view-switch button.active {
            background: var(--black);
            color: var(--gold-lt);
            box-shadow: 0 6px 16px rgba(0,0,0,.14);
        }

        .product-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .layout-switch {
            display: inline-flex;
            gap: 5px;
            padding: 5px;
            margin: 4px 0 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        .layout-switch button {
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            background: transparent;
            color: var(--muted);
            font-family: var(--sans);
            font-weight: 600;
            cursor: pointer;
        }

        .layout-switch button.active {
            background: var(--black);
            color: var(--gold-lt);
        }

        .item-grid.list-view {
            grid-template-columns: 1fr;
        }

        .item-grid.list-view .item-card {
            display: grid;
            grid-template-columns: 170px minmax(0, 1fr);
        }

        .item-grid.list-view .item-thumb,
        .item-grid.list-view .item-thumb-icon {
            width: 170px;
            height: 100%;
            min-height: 155px;
            aspect-ratio: auto;
        }

        .item-grid.list-view .item-actions {
            margin-top: auto;
        }

        .product-form-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(8,8,8,.72);
            backdrop-filter: blur(5px);
        }

        .product-form-modal {
            width: min(920px, 100%);
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            margin: 0;
            border: 1px solid #eee0bd;
            background: #fffdf6;
            box-shadow: 0 28px 80px rgba(0,0,0,.35);
        }

        .product-form-head {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: 14px;
            background: #fffdf6;
            border-bottom: 1px solid var(--line);
        }

        .modal-close {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: var(--cream);
            color: var(--black);
            cursor: pointer;
        }

        .item-card {
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
            transition: box-shadow .18s var(--ease), transform .18s var(--ease);
        }

        .item-card:hover {
            box-shadow: 0 14px 30px rgba(20,15,5,.10);
            transform: translateY(-2px);
        }

        .item-thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: var(--cream);
        }

        .item-thumb-icon {
            width: 100%;
            aspect-ratio: 16 / 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--gold);
            background: linear-gradient(135deg, var(--cream), #f4ebd6);
        }

        .item-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--serif);
            font-weight: 700;
            font-size: 20px;
            color: var(--black);
            background: linear-gradient(145deg, var(--pink), var(--pink-md));
            margin: 16px auto 0;
        }

        .item-body {
            padding: 14px 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .item-title {
            font-weight: 700;
            font-size: 14.5px;
            color: var(--black);
        }

        .item-meta {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .item-desc {
            font-size: 12.5px;
            color: var(--gray);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .stars-row {
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .item-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
            padding-top: 8px;
        }

        .item-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .quote-card {
            text-align: center;
            padding-bottom: 16px;
        }

        .quote-text {
            font-style: italic;
            color: var(--rich);
        }

        /* ---------- LOGIN ---------- */

        .login-wrap {
            min-height: calc(100vh - 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login {
            max-width: 400px;
            width: 100%;
            margin: 0;
            text-align: center;
            padding: 36px 32px;
        }

        .login .brand-mark {
            width: 56px;
            height: 56px;
            font-size: 22px;
            margin: 0 auto 14px;
        }

        .login h2 {
            font-size: 24px;
        }

        .login .sub {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .login label {
            display: block;
            text-align: left;
            margin-top: 14px;
        }

        .notice {
            padding: 11px 14px;
            border-radius: 10px;
            background: #fbf1da;
            color: #6d541b;
            margin-bottom: 4px;
            font-size: 12.5px;
            text-align: left;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        #loginErr {
            color: var(--danger);
            font-size: 13px;
            min-height: 18px;
            margin: 14px 0 0;
        }

        /* ---------- DASHBOARD ---------- */

        .welcome-card {
            background: linear-gradient(120deg, var(--black) 0%, var(--deep) 60%, #241b10 100%);
            color: #fff;
            border: 0;
            position: relative;
            overflow: hidden;
        }

        .welcome-card::after {
            content: '';
            position: absolute;
            right: -60px;
            top: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,.28), transparent 70%);
        }

        .welcome-card h2 {
            color: #fff;
            font-size: 26px;
        }

        .welcome-card p {
            color: #d8d2c4;
            max-width: 520px;
            font-size: 13.5px;
            margin: 6px 0 0;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .stat-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: transform .18s var(--ease), box-shadow .18s var(--ease);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(20,15,5,.10);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            flex: none;
            background: var(--cream);
            color: var(--gold);
        }

        .stat-icon.pink {
            background: var(--blush);
            color: var(--pink-md);
        }

        .stat-icon.dark {
            background: #eee;
            color: var(--black);
        }

        .stat-icon.danger {
            background: var(--danger-lt);
            color: var(--danger);
        }

        .stat-number {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 700;
            color: var(--black);
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .quick-card {
            border: 1px dashed #e6d6a8;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            background: var(--cream);
            transition: background .15s var(--ease), border-color .15s var(--ease);
        }

        .quick-card:hover {
            background: #f6ecd1;
            border-color: var(--gold);
        }

        .quick-card i {
            font-size: 18px;
            color: var(--gold);
        }

        .quick-card b {
            display: block;
            font-size: 13.5px;
        }

        .quick-card span {
            font-size: 11.5px;
            color: var(--muted);
        }

        /* ---------- IMAGE UPLOAD ---------- */

        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .image-preview-item {
            position: relative;
            border: 2px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .image-preview-item.primary { border-color: var(--gold); }

        .image-preview img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .image-preview-actions {
            display: flex;
            gap: 5px;
            padding: 7px;
        }

        .image-preview-actions button {
            flex: 1;
            border: 0;
            border-radius: 7px;
            padding: 6px;
            font-size: 10px;
            cursor: pointer;
        }

        .upload-status {
            display: inline-block;
            margin-left: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 900px) {
            .tabs {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .stat-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .quick-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .row {
                flex-direction: column;
            }

            .actions {
                flex-wrap: wrap;
            }

            .brand-text span {
                display: none;
            }

            header {
                padding: 12px 14px;
            }

            .top-search {
                width: min(210px, 48vw);
            }

            .top-search input {
                font-size: 12px;
            }

            .item-grid.list-view .item-card {
                grid-template-columns: 110px minmax(0, 1fr);
            }

            .item-grid.list-view .item-thumb,
            .item-grid.list-view .item-thumb-icon {
                width: 110px;
            }
        }

        @media (max-width: 460px) {
            .brand-text {
                display: none;
            }

            .top-search {
                width: 180px;
            }

            #logoutBtn {
                padding: 10px 12px;
                font-size: 0;
            }

            #logoutBtn i {
                font-size: 14px;
            }

            .tabs {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
            <strong>ADORE Hair Studio</strong>
            <span>Admin Console</span>
        </div>
    </div>

    <div class="header-actions">
        <label class="top-search hidden" id="topSearchWrap" aria-label="Search products">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="topSearch" type="search" placeholder="Search products by name or category..." oninput="handleProductSearch(this.value)">
        </label>
        <button
            class="btn secondary"
            id="logoutBtn"
            onclick="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Logout
        </button>
    </div>
</header>

<main>

    <!-- LOGIN -->
    <section id="loginView" class="hidden">

        <div class="login-wrap">
            <div class="card login">

                <div class="brand-mark">A</div>

                <h2>Welcome back</h2>
                <p class="sub">Sign in to manage Adore Hair Studio</p>

                <div class="notice">
                    <i class="fa-solid fa-circle-info" style="margin-top:2px;"></i>
                    <span>Use the ADMIN_EMAIL and ADMIN_PASSWORD configured on the server.</span>
                </div>

                <label>
                    Email
                    <input id="loginEmail" type="email" placeholder="you@adorehairstudio.com">
                </label>

                <label>
                    Password
                    <input id="loginPassword" type="password" placeholder="••••••••">
                </label>

                <button
                    class="btn primary block"
                    style="margin-top:20px"
                    onclick="login()">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign in
                </button>

                <p id="loginErr"></p>

            </div>
        </div>

    </section>


    <!-- ADMIN APPLICATION -->
    <section id="appView" class="hidden">

        <div class="tabs">

            <button data-tab="dashboard" class="active">
                <span class="tab-icon"><i class="fa-solid fa-gauge-high"></i></span>
                Dashboard
            </button>

            <button data-tab="products">
                <span class="tab-icon"><i class="fa-solid fa-bag-shopping"></i></span>
                All Products
            </button>

            <button data-tab="services">
                <span class="tab-icon"><i class="fa-solid fa-scissors"></i></span>
                Services
            </button>

            <button data-tab="testimonials">
                <span class="tab-icon"><i class="fa-solid fa-quote-left"></i></span>
                Testimonials
            </button>

            <button data-tab="reviews">
                <span class="tab-icon"><i class="fa-solid fa-star-half-stroke"></i></span>
                Reviews
            </button>

            <button data-tab="messages">
                <span class="tab-icon"><i class="fa-solid fa-envelope"></i></span>
                Messages
                <span class="tab-badge hidden" id="msgTabBadge">0</span>
            </button>

            <button data-tab="settings">
                <span class="tab-icon"><i class="fa-solid fa-gear"></i></span>
                Site Settings
            </button>

        </div>

        <div id="content" class="card"></div>

    </section>

</main>


<script>

    /* =========================================================
       AUTHENTICATION / API
    ========================================================= */

    let token =
        localStorage.getItem('adore_admin_token') || '';

    let tab = 'dashboard';
    let allProductsCache = [];
    let productSearchQuery = '';
    let pendingProductImages = [];
    let adminProductGroup = 'WIG';
    let adminProductLayout = localStorage.getItem('adore_product_layout') || 'grid';


   const api = async (path, opt = {}) => {

    const response = await fetch(path, {
        ...opt,
        headers: {
            'Content-Type': 'application/json',
            ...(opt.headers || {}),
            ...(token
                ? {Authorization: 'Bearer ' + token}
                : {})
        }
    });

    if (response.status === 401) {
        logout();
        throw new Error('Session expired');
    }

    if (!response.ok) {
        const message = await response.text();
        throw new Error(
            message || 'Request failed'
        );
    }

    if (response.status === 204) {
        return null;
    }

    const text = await response.text();

    if (!text) {
        return null;
    }

    return JSON.parse(text);
};


    function showApp() {

        document
            .getElementById('loginView')
            .classList.add('hidden');

        document
            .getElementById('appView')
            .classList.remove('hidden');

        document.getElementById(
            'logoutBtn'
        ).style.visibility = 'visible';

        document.getElementById('topSearchWrap').classList.remove('hidden');

        load();
    }


    function showLogin() {

        document
            .getElementById('loginView')
            .classList.remove('hidden');

        document
            .getElementById('appView')
            .classList.add('hidden');

        document.getElementById(
            'logoutBtn'
        ).style.visibility = 'hidden';

        document.getElementById('topSearchWrap').classList.add('hidden');
    }


    async function login() {

        const loginErr =
            document.getElementById('loginErr');

        loginErr.textContent = '';

        try {

            const email =
                document.getElementById('loginEmail').value;

            const password =
                document.getElementById('loginPassword').value;

            const r = await api(
                '/api/auth/login',
                {
                    method: 'POST',
                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

            token = r.token;

            localStorage.setItem(
                'adore_admin_token',
                token
            );

            showApp();

        } catch (e) {

            loginErr.textContent = e.message;
        }
    }


    function logout() {

        token = '';

        localStorage.removeItem(
            'adore_admin_token'
        );

        showLogin();
    }


    /* =========================================================
       TABS
    ========================================================= */

    document
        .querySelectorAll('.tabs button')
        .forEach(button => {

            button.onclick = () => {

                document
                    .querySelectorAll('.tabs button')
                    .forEach(x =>
                        x.classList.remove('active')
                    );

                button.classList.add('active');

                tab = button.dataset.tab;

                load();
            };
        });


    /* =========================================================
       HELPERS
    ========================================================= */

    const esc = s =>
        String(s ?? '')
            .replace(
                /[&<>"]/g,
                c => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;'
                }[c])
            );


    const arg = x =>
        JSON.stringify(x)
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'")
            .replace(/</g, '\\u003c')
            .replace(/>/g, '\\u003e');


    const starIcons = n => {

        const count =
            Math.max(0, Math.min(5, Number(n) || 0));

        return (
            '<i class="fa-solid fa-star"></i>'.repeat(count) +
            '<i class="fa-regular fa-star" style="opacity:.4"></i>'.repeat(5 - count)
        );
    };


    const initials = name =>
        String(name || '?')
            .trim()
            .split(/\s+/)
            .slice(0, 2)
            .map(w => w[0]?.toUpperCase() || '')
            .join('');


    /* =========================================================
       LOAD CURRENT TAB
    ========================================================= */

    async function load() {

        const content =
            document.getElementById('content');

        content.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                Loading…
            </div>
        `;

        try {

            if (tab === 'dashboard') {

                const [
                    products,
                    services,
                    testimonials,
                    messages,
                    reviews
                ] = await Promise.all([
                    api('/api/admin/products'),
                    api('/api/admin/services'),
                    api('/api/admin/testimonials'),
                    api('/api/admin/messages'),
                    api('/api/admin/reviews')
                ]);

                updateMessageBadge(messages);

                renderDashboard({
                    products,
                    services,
                    testimonials,
                    messages,
                    reviews
                });
            }

            if (tab === 'products') {
                allProductsCache = await api('/api/admin/products');
                renderProducts(allProductsCache);
            }

            if (tab === 'services') {
                renderServices(
                    await api('/api/admin/services')
                );
            }

            if (tab === 'testimonials') {
                renderTestimonials(
                    await api('/api/admin/testimonials')
                );
            }

            if (tab === 'reviews') {
                const [reviews, products] = await Promise.all([
                    api('/api/admin/reviews'),
                    api('/api/admin/products')
                ]);

                renderReviews(reviews, products);
            }

            if (tab === 'messages') {
                const messages =
                    await api('/api/admin/messages');

                updateMessageBadge(messages);

                renderMessages(messages);
            }

            if (tab === 'settings') {
                renderSettings(
                    await api('/api/admin/settings')
                );
            }

        } catch (e) {

            content.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    ${esc(e.message)}
                </div>
            `;
        }
    }


    function goTab(name) {

        tab = name;

        document
            .querySelectorAll('.tabs button')
            .forEach(btn =>
                btn.classList.toggle(
                    'active',
                    btn.dataset.tab === name
                )
            );

        load();
    }


    function handleProductSearch(value) {
        productSearchQuery = value.trim().toLowerCase();

        if (productSearchQuery && tab !== 'products') {
            goTab('products');
            return;
        }

        if (tab === 'products') {
            renderProducts(allProductsCache);
        }
    }


    function updateMessageBadge(messages) {

        const badge =
            document.getElementById('msgTabBadge');

        if (!badge) return;

        const unread =
            (messages || [])
                .filter(m => !m.readMessage)
                .length;

        if (unread > 0) {
            badge.textContent =
                unread > 9 ? '9+' : String(unread);
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }


    /* =========================================================
       DASHBOARD
    ========================================================= */

    function renderDashboard({ products, services, testimonials, messages, reviews }) {

        const content =
            document.getElementById('content');

        const unread =
            messages.filter(m => !m.readMessage).length;

        const activeProducts =
            products.filter(p => p.active !== false).length;

        reviews = reviews || [];

        const hour =
            new Date().getHours();

        const greeting =
            hour < 12
                ? 'Good morning'
                : hour < 18
                    ? 'Good afternoon'
                    : 'Good evening';

        content.innerHTML = `

            <div class="card welcome-card">
                <h2>${greeting}, welcome back ✨</h2>
                <p>
                    Here's a snapshot of Adore Hair Studio. Manage your
                    wigs, services, testimonials and client messages
                    all from this dashboard.
                </p>
            </div>

            <div class="stat-grid">

                <div class="stat-card" onclick="goTab('products')">
                    <div class="stat-icon">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </div>
                    <div>
                        <div class="stat-number">${products.length}</div>
                        <div class="stat-label">Products · ${activeProducts} active</div>
                    </div>
                </div>

                <div class="stat-card" onclick="goTab('services')">
                    <div class="stat-icon pink">
                        <i class="fa-solid fa-scissors"></i>
                    </div>
                    <div>
                        <div class="stat-number">${services.length}</div>
                        <div class="stat-label">Services offered</div>
                    </div>
                </div>

                <div class="stat-card" onclick="goTab('testimonials')">
                    <div class="stat-icon dark">
                        <i class="fa-solid fa-quote-left"></i>
                    </div>
                    <div>
                        <div class="stat-number">${testimonials.length}</div>
                        <div class="stat-label">Client testimonials</div>
                    </div>
                </div>

                <div class="stat-card" onclick="goTab('reviews')">
                    <div class="stat-icon pink">
                        <i class="fa-solid fa-star-half-stroke"></i>
                    </div>
                    <div>
                        <div class="stat-number">${reviews.length}</div>
                        <div class="stat-label">Product reviews</div>
                    </div>
                </div>

                <div class="stat-card" onclick="goTab('messages')">
                    <div class="stat-icon ${unread ? 'danger' : ''}">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                        <div class="stat-number">${messages.length}</div>
                        <div class="stat-label">${unread ? unread + ' unread message' + (unread === 1 ? '' : 's') : 'Messages · all read'}</div>
                    </div>
                </div>

            </div>

            <div class="card">

                <div class="section-head">
                    <div>
                        <h3>Quick actions</h3>
                        <p>Jump straight into the most common tasks.</p>
                    </div>
                </div>

                <div class="quick-grid">

                    <div class="quick-card" onclick="goTab('products')">
                        <i class="fa-solid fa-plus"></i>
                        <div>
                            <b>Add a product</b>
                            <span>List a new wig or item</span>
                        </div>
                    </div>

                    <div class="quick-card" onclick="goTab('testimonials')">
                        <i class="fa-solid fa-star"></i>
                        <div>
                            <b>Add a testimonial</b>
                            <span>Share a happy client review</span>
                        </div>
                    </div>

                    <div class="quick-card" onclick="goTab('settings')">
                        <i class="fa-solid fa-gear"></i>
                        <div>
                            <b>Update site settings</b>
                            <span>Contact info & hero text</span>
                        </div>
                    </div>

                </div>

            </div>
        `;
    }


    /* =========================================================
       PRODUCTS
    ========================================================= */

    function getProductType(product) {
        if (product.productType) {
            return String(product.productType).toUpperCase();
        }

        const wigCategories = ['lace', 'body-wave', 'curly', 'colored', 'closure'];
        return !product.category || wigCategories.includes(product.category)
            ? 'WIG'
            : 'OTHER';
    }

    function selectProductGroup(group) {
        adminProductGroup = group;
        renderProducts(allProductsCache);
    }

    function selectProductLayout(layout) {
        adminProductLayout = layout === 'list' ? 'list' : 'grid';
        localStorage.setItem('adore_product_layout', adminProductLayout);
        renderProducts(allProductsCache);
    }


    function renderProducts(xs) {

        const content = document.getElementById('content');
        const categoryLabels = {
            'lace': 'Lace Front',
            'body-wave': 'Body Wave',
            'curly': 'Curly',
            'colored': 'Colored',
            'closure': 'Closure',
            'perfume': 'Perfume',
            'hair-care': 'Hair Care',
            'accessories': 'Accessories',
            'other': 'Other'
        };

        const matchingProducts = xs.filter(product => {
            if (!productSearchQuery) return true;

            return [
                product.name,
                product.description,
                categoryLabels[product.category] || product.category,
                getProductType(product) === 'WIG' ? 'wig' : 'other product'
            ].some(value => String(value || '').toLowerCase().includes(productSearchQuery));
        });

        const wigs = matchingProducts.filter(product => getProductType(product) === 'WIG');
        const otherProducts = matchingProducts.filter(product => getProductType(product) === 'OTHER');

        const cards = products => products.length ? `
            <div class="item-grid ${adminProductLayout === 'list' ? 'list-view' : ''}">
                ${products.map(x => `
                    <div class="item-card">
                        ${x.imageUrl
                            ? `<img class="item-thumb" src="${esc(x.imageUrl)}" alt="${esc(x.name)}">`
                            : `<div class="item-thumb-icon"><i class="fa-solid fa-image"></i></div>`}

                        <div class="item-body">
                            <div class="item-title">${esc(x.name)}</div>
                            <div class="item-meta">
                                <span class="pill gold">GH₵ ${esc(x.price)}</span>
                                ${x.category
                                    ? `<span class="pill off">${esc(categoryLabels[x.category] || x.category)}</span>`
                                    : ''}
                                ${x.featured ? `<span class="pill ok"><i class="fa-solid fa-star"></i> Featured</span>` : ''}
                                ${x.active === false ? `<span class="pill danger">Hidden</span>` : ''}
                            </div>
                            ${x.description ? `<div class="item-desc">${esc(x.description)}</div>` : ''}
                            <div class="item-actions">
                                <button class="btn secondary small" onclick='productForm(${arg(x)})'>
                                    <i class="fa-solid fa-pen"></i> Edit
                                </button>
                                <button class="btn danger small" onclick="del('products', ${x.id})">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        ` : `
            <div class="empty-state">
                <i class="fa-solid fa-box-open"></i>
                ${productSearchQuery ? 'No matching products in this group.' : 'No products in this group yet.'}
            </div>
        `;

        content.innerHTML = `
            <div class="section-head">
                <div>
                    <h2><i class="fa-solid fa-bag-shopping" style="color:var(--gold);font-size:18px;margin-right:8px;"></i>All Products</h2>
                    <p>Wigs and other products are managed in separate groups (${xs.length} total).</p>
                </div>
                <button class="btn primary" onclick="productForm()">
                    <i class="fa-solid fa-plus"></i> Add product
                </button>
            </div>

            <div id="form"></div>

            <div class="product-controls">
                <div class="product-view-switch" role="tablist" aria-label="Choose a product group">
                    <button class="${adminProductGroup === 'WIG' ? 'active' : ''}" onclick="selectProductGroup('WIG')">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Wigs (${wigs.length})
                    </button>
                    <button class="${adminProductGroup === 'OTHER' ? 'active' : ''}" onclick="selectProductGroup('OTHER')">
                        <i class="fa-solid fa-boxes-stacked"></i> Other Products (${otherProducts.length})
                    </button>
                </div>

                <div class="layout-switch" aria-label="Product display style">
                    <button class="${adminProductLayout === 'grid' ? 'active' : ''}" onclick="selectProductLayout('grid')" title="Grid view">
                        <i class="fa-solid fa-table-cells-large"></i> Grid
                    </button>
                    <button class="${adminProductLayout === 'list' ? 'active' : ''}" onclick="selectProductLayout('list')" title="List view">
                        <i class="fa-solid fa-list"></i> List
                    </button>
                </div>
            </div>

            <section class="product-group">
                <div class="product-group-head">
                    <h3>${adminProductGroup === 'WIG'
                        ? '<i class="fa-solid fa-wand-magic-sparkles"></i> Wigs'
                        : '<i class="fa-solid fa-boxes-stacked"></i> Other Products'}</h3>
                    <span class="pill gold">${adminProductGroup === 'WIG' ? wigs.length : otherProducts.length}</span>
                </div>
                ${cards(adminProductGroup === 'WIG' ? wigs : otherProducts)}
            </section>
        `;
    }


    function productForm(x = {}) {

        if (!x.id && !x.productType) {
            x = {...x, productType: adminProductGroup};
        }

        pendingProductImages = [...new Set([
            ...(x.imageUrls || []),
            x.imageUrl
        ].filter(Boolean))];

        const form =
            document.getElementById('form');

        form.innerHTML = `

            <div class="product-form-overlay" onclick="if(event.target === this) closeProductForm()">
            <div class="card product-form-modal">

                <div class="product-form-head">
                    <h3><i class="fa-solid fa-pen" style="color:var(--gold);font-size:15px;margin-right:6px;"></i>${x.id ? 'Edit' : 'New'} product</h3>
                    <button type="button" class="modal-close" onclick="closeProductForm()" aria-label="Close product form">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="grid">

                    <label>

                        Name

                        <input
                            id="pname"
                            value="${esc(x.name || '')}">

                    </label>


                    <label>

                        Price

                        <input
                            id="pprice"
                            type="number"
                            step="0.01"
                            min="0"
                            value="${esc(x.price || '')}">

                    </label>


                    <label>

                        Old price

                        <input
                            id="pold"
                            type="number"
                            step="0.01"
                            min="0"
                            value="${esc(x.oldPrice || '')}">

                    </label>


                    <label>

                        Product type

                        <select id="ptype" onchange="updateProductCategoryOptions()">
                            <option value="WIG" ${getProductType(x) === 'WIG' ? 'selected' : ''}>Wig</option>
                            <option value="OTHER" ${getProductType(x) === 'OTHER' ? 'selected' : ''}>Other product</option>
                        </select>

                    </label>


                    <label>

                        Category

                        <select id="pcat">
                        </select>

                    </label>


                    <label>

                        Tag

                        <input
                            id="ptag"
                            placeholder="e.g. Best Seller"
                            value="${esc(x.tag || '')}">

                    </label>


                    <label>

                        Stars

                        <input
                            id="pstars"
                            type="number"
                            min="0"
                            max="5"
                            value="${x.stars ?? 5}">

                    </label>


                    <label>

                        Display order

                        <input
                            id="porder"
                            type="number"
                            value="${x.displayOrder ?? 0}">

                    </label>

                </div>


                <br>


                <label>

                    Product Images

                    <input
                        id="pfile"
                        type="file"
                        multiple
                        accept="image/jpeg,image/png,image/webp">

                </label>


                <div
                    id="imagePreview"
                    class="image-preview">
                </div>


                <button
                    type="button"
                    class="btn secondary"
                    onclick="uploadProductImages()"
                    style="margin-top:10px">

    }

    function makePrimaryImage(index) {
        const [image] = pendingProductImages.splice(index, 1);
        pendingProductImages.unshift(image);
        renderPendingProductImages();

    function removeProductImage(index) {
        pendingProductImages.splice(index, 1);

    }

    async function uploadProductImages() {
        const files = [...document.getElementById('pfile').files];
        const status = document.getElementById('uploadStatus');
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        const maxSize = 10 * 1024 * 1024;

        if (!files.length) { alert('Choose one or more images first.'); return; }
        if (files.some(file => !allowedTypes.includes(file.type))) { alert('Only JPG, PNG and WEBP images are allowed.'); return; }
        if (files.some(file => file.size > maxSize)) { alert('Each image must be 10MB or smaller.'); return; }

        status.textContent = `Uploading 0 of ${files.length}...`;
        try {
            for (let index = 0; index < files.length; index++) {
                const formData = new FormData();
                formData.append('file', files[index]);
                const res = await fetch('/api/admin/images/upload', {
                    method: 'POST',
                    headers: {Authorization: 'Bearer ' + token},
                    body: formData
                });
                if (res.status === 401) { logout(); throw new Error('Session expired'); }
                if (!res.ok) throw new Error(await res.text());
                const result = await res.json();
                if (!result.url) throw new Error('No image URL was returned.');
                if (!pendingProductImages.includes(result.url)) pendingProductImages.push(result.url);
                status.textContent = `Uploading ${index + 1} of ${files.length}...`;
                renderPendingProductImages();
            }
            status.textContent = `✓ ${files.length} image${files.length === 1 ? '' : 's'} uploaded`;
            document.getElementById('pfile').value = '';
        } catch (e) {
            console.error('Image upload failed:', e);
            status.textContent = 'Upload failed';
            alert('One or more images could not be uploaded. Images completed before the error are still available.');
        }
    }

    function generateProductDescription() {
        const name = document.getElementById('pname').value.trim();
        const type = document.getElementById('ptype').value;
        const categorySelect = document.getElementById('pcat');
        const category = categorySelect.options[categorySelect.selectedIndex]?.text || 'product';
        if (!name) { alert('Enter the product name first.'); return; }
        const description = type === 'WIG'
            ? `${name} is a beautifully finished ${category.toLowerCase()} wig designed for a natural, confident look. It offers comfortable wear, elegant movement and versatile styling for everyday use or special occasions.`
            : `${name} is a carefully selected ${category.toLowerCase()} product created to complement your beauty routine. It combines quality, convenience and a refined finish for dependable everyday use.`;
        document.getElementById('pdesc').value = description;
    }


    async function saveProduct(id) {

        const name =
            document.getElementById('pname')
                .value
                .trim();

        const price =
            document.getElementById('pprice')
                .value;

        const imageUrl = pendingProductImages[0] || '';

        const productType = document.getElementById('ptype').value;
        const category = document.getElementById('pcat').value;


        if (!name) {

            alert(
                'Please enter the product name.'
            );

            return;
        }


        if (
            !price ||
            Number(price) <= 0
        ) {

            alert(
                'Please enter a valid product price.'
            );

            return;
        }


        if (!imageUrl) {

            alert(
                'Please upload a product image before saving.'
            );

            return;
        }

        if (!category) {
            alert('Please select a category for this product.');
            return;
        }


        const body = {

            name,

            price:
                Number(price),

            oldPrice:
                document
                    .getElementById('pold')
                    .value

                    ? Number(
                        document
                            .getElementById('pold')
                            .value
                      )

                    : null,

            productType,

            category,

            tag:
                document
                    .getElementById('ptag')
                    .value
                    .trim(),

            imageUrl,

            imageUrls: pendingProductImages,

            stars:
                Number(
                    document
                        .getElementById('pstars')
                        .value
                ),

            displayOrder:
                Number(
                    document
                        .getElementById('porder')
                        .value
                ),

            description:
                document
                    .getElementById('pdesc')
                    .value
                    .trim(),

            featured:
                document
                    .getElementById('pfeatured')
                    .checked,

            active:
                document
                    .getElementById('pactive')
                    .checked
        };


        try {

            await api(

                '/api/admin/products'
                + (id
                    ? '/' + id
                    : ''),

                {

                    method:
                        id
                            ? 'PUT'
                            : 'POST',

                    body:
                        JSON.stringify(body)

                }
            );


            alert(
                id
                    ? 'Product updated successfully.'
                    : 'Product added successfully.'
            );

            document.body.style.overflow = '';
            load();


        } catch (e) {

            alert(
                'Could not save product: '
                + e.message
            );
        }
    }

                <div style="margin-top:14px;">

                    <label>

                        Hero eyebrow

                        <input
                            id="xeye"
                            value="${esc(
                                x.heroEyebrow || ''
                            )}">

                    </label>


                    <label style="display:block;margin-top:14px;">

                        Hero title

                        <input
                            id="xtitle"
                            value="${esc(
                                x.heroTitle || ''
                            )}">

                    </label>


                    <label style="display:block;margin-top:14px;">

                        Hero tagline

                        <textarea
                            id="xtag">${esc(
                                x.heroTagline || ''
                            )}</textarea>

                    </label>

                </div>

            </div>


            <button
                class="btn primary"
                onclick="saveSettings()">

                <i class="fa-solid fa-check"></i>
                Save settings

            </button>

        `;
    }


    async function saveSettings() {

        const body = {

            id: 1,

            phone:
                document
                    .getElementById('xphone')
                    .value,

            whatsapp:
                document
                    .getElementById('xwa')
                    .value,

            email:
                document
                    .getElementById('xemail')
                    .value,

            instagram:
                document
                    .getElementById('xig')
                    .value,

            address:
                document
                    .getElementById('xaddress')
                    .value,

            heroEyebrow:
                document
                    .getElementById('xeye')
                    .value,

            heroTitle:
                document
                    .getElementById('xtitle')
                    .value,

            heroTagline:
                document
                    .getElementById('xtag')
                    .value
        };


        await api(

            '/api/admin/settings',

            {
                method: 'PUT',
                body:
                    JSON.stringify(body)
            }
        );


        alert(
            'Settings saved successfully.'
        );


        load();
    }


    /* =========================================================
       DELETE
    ========================================================= */

 async function del(type, id) {
    const ok = confirm(
        'Are you sure you want to permanently delete this item?'
    );

    if (!ok) return;

    try {
        await api(
            '/api/admin/' + type + '/' + id,
            {
                method: 'DELETE'
            }
        );

        alert('Deleted successfully.');

        await load();

    } catch (e) {
        console.error('Delete failed:', e);

        alert(
            'Could not delete this item.\n\n' +
            e.message
        );
    }
}

    /* =========================================================
       START
    ========================================================= */

    if (token) {
        showApp();
    } else {
        showLogin();
    }

</script>

</body>
</html>
